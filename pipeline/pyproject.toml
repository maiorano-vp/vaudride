[project]
name = "vaudride-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["rasterio", "shapely", "pyproj", "gpxpy", "pyyaml", "numpy"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "types-PyYAML"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[[tool.mypy.overrides]]
module = ["rasterio.*", "shapely.*", "gpxpy.*", "pyproj.*"]
ignore_missing_imports = true
